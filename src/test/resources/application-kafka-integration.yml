catedra:
  group-id: kafka-integration-test
  technical-jwt: kafka-integration-test-jwt
  rest:
    base-url: http://localhost:18080
    connect-timeout: 2s
    read-timeout: 5s
  redis:
    host: localhost
    port: 6379
    username: test-user
    password: test-only-password
    read-namespace: "catedra:sync:*"
    write-namespace: "alumnos:kafka-integration-test:*"
    connect-timeout: 2s
    command-timeout: 5s
  kafka:
    bootstrap-servers: ${CATEDRA_KAFKA_BOOTSTRAP_SERVERS:}
    consumer-group-id: ${CATEDRA_KAFKA_CONSUMER_GROUP_ID:}
    catalog-topic: ${CATEDRA_KAFKA_CATALOG_TOPIC:}
