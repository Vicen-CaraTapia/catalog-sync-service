catedra:
  group-id: test-catalog-sync
  technical-jwt: test-only-technical-jwt
  rest:
    base-url: http://localhost:18080
    connect-timeout: 2s
    read-timeout: 5s
  redis:
    host: localhost
    port: 6379
    username: test-user
    password: test-only-password
    read-namespace: "catedra:sync:*"
    write-namespace: "alumnos:test-catalog-sync:*"
    connect-timeout: 2s
    command-timeout: 5s
  kafka:
    bootstrap-servers: localhost:19092
    consumer-group-id: test-catalog-sync-consumer
    catalog-topic: catedra.catalog.test-catalog-sync

management:
  health:
    redis:
      enabled: false
